<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="/icon.png">
    <link rel="stylesheet" href="/vendor/phosphor/style.css">
    <title data-i18n="app.docTitle">Microsoft Rewards Dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.skipToMain">Skip to main content</a>

    <header class="topbar">
      <h1 data-i18n="app.title">🏅 Rewards Dashboard</h1>
      <div class="topbar-right">
        <p
          id="statusBadge"
          class="status-badge status-unknown"
          role="status"
          aria-live="polite"
        >
          <span class="dot" aria-hidden="true"></span>
          <span id="statusText" data-i18n="status.connecting">Connecting&hellip;</span>
        </p>
        <div class="controls-group">
          <a
            class="icon-btn"
            id="githubLink"
            href="https://github.com/zPan2327/rewards-dashboard-i18n"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub"
            data-i18n-title="app.githubLink"
            aria-label="GitHub"
            data-i18n-aria-label="app.githubLink"
          >
            <svg class="icon-github" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
              />
            </svg>
          </a>
          <button
            type="button"
            id="modeToggle"
            class="icon-btn"
            aria-label="Switch to dark mode"
            title="Switch to dark mode"
          >
            <span id="modeIcon" aria-hidden="true">&#9789;</span>
          </button>
          <div class="theme-select-wrapper">
            <label for="themeSelect" class="visually-hidden" data-i18n="app.themeLabel">Theme</label>
            <select id="themeSelect" class="theme-select"></select>
          </div>
          <div class="theme-select-wrapper">
            <label for="langSelect" class="visually-hidden" data-i18n="app.languageLabel">Language</label>
            <select id="langSelect" class="theme-select"></select>
          </div>
        </div>
      </div>
    </header>

    <nav class="tabbar" aria-label="Dashboard sections" data-i18n-aria-label="app.sectionsLabel">
      <div class="tabbar-inner" id="tabBar" role="tablist"></div>
    </nav>

    <!-- Run controls stay visible on every tab: stopping a bad run shouldn't
     depend on which section you happen to be looking at. -->
    <div class="control-strip">
      <div class="ctl-state">
        <span id="ctlPill" class="pill pill-idle" data-i18n="pill.idle">Idle</span>
        <span id="ctlDetail" class="ctl-detail">&ndash;</span>
      </div>
      <div class="ctl-actions">
        <button type="button" id="btnStart" class="btn btn-primary" data-i18n="ctl.start">
          Start run
        </button>
        <button type="button" id="btnStop" class="btn" data-i18n="ctl.stop">Stop</button>
        <button type="button" id="btnRestart" class="btn" data-i18n="ctl.restart">Restart</button>
        <div class="ctl-more">
          <button
            type="button"
            id="btnMore"
            class="btn btn-icon"
            aria-haspopup="true"
            aria-expanded="false"
            aria-label="More actions"
            title="More actions"
            data-i18n-aria-label="ctl.moreActions"
            data-i18n-title="ctl.moreActions"
          >
            &#8942;
          </button>
          <div class="ctl-menu" id="ctlMenu" hidden>
            <button
              type="button"
              id="btnForceStop"
              class="ctl-menu-item danger"
              data-i18n="ctl.forceStop"
            >
              Force stop (SIGKILL)
            </button>
            <button type="button" id="btnShutdown" class="ctl-menu-item danger" data-i18n="ctl.shutdown">
              Shut down control API
            </button>
          </div>
        </div>
      </div>
    </div>

    <main id="main">
      <section
        id="loginCodesSection"
        class="login-codes-section"
        hidden
        aria-labelledby="login-codes-heading"
      >
        <h2 id="login-codes-heading" data-i18n="loginCodes.heading">&#128273; Login approval needed</h2>
        <div id="loginCodesList" class="login-codes-list"></div>
      </section>
      <div
        id="loginCodesAnnounce"
        class="visually-hidden"
        aria-live="assertive"
        aria-atomic="true"
      ></div>

      <div id="tabPanels"></div>
    </main>

    <footer class="foot">
        <span id="footerVersion"></span>
        <span class="foot-separator">•</span>
        <span id="footerScriptVersion"></span>
        <span class="foot-separator">•</span>
        <span id="footerStatus" data-i18n="status.connecting">Connecting…</span>
        <a
          class="foot-github"
          href="https://github.com/zPan2327/rewards-dashboard-i18n"
          target="_blank"
          rel="noopener noreferrer"
          title="GitHub"
          data-i18n-title="app.githubLink"
          aria-label="GitHub"
          data-i18n-aria-label="app.githubLink"
        >
          <svg class="icon-github" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
        </a>
    </footer>

    <script src="/version.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
